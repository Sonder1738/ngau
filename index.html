
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Identifier</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px 16px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #10131c;
            color: #f1f5f9;
        }

        .container {
            max-width: 720px;
            margin: auto;
            background: #1b2030;
            padding: 28px;
            border-radius: 16px;
            border: 1px solid #30394d;
        }

        h1 { margin-top: 0; text-align: center; }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3b465c;
            background: #111827;
            color: white;
            font-size: 14px;
        }

        .drop-zone {
            border: 2px dashed #586783;
            padding: 30px 15px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            color: #aab6ca;
            margin-top: 10px;
        }

        .drop-zone:hover {
            border-color: #818cf8;
            background: #242c40;
        }

        #preview {
            display: none;
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            margin-top: 20px;
            border-radius: 10px;
            background: #111827;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover { background: #4f46e5; }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 10px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #status {
            text-align: center;
            color: #a5b4fc;
            margin-top: 15px;
        }

        .hint {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 6px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .checkbox-row input { width: auto; }

        .free-badge {
            display: inline-block;
            background: #064e3b;
            color: #6ee7b7;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin: 0 auto 15px;
        }

        .center { text-align: center; }
    </style>
</head>

<body>

<div class="container">

    <h1>🔍 AI Image Identifier</h1>

    <p class="subtitle">
        Upload a picture and let AI tell you what it sees.
    </p>

    <div class="center">
        <span class="free-badge">⚡ OpenRouter Free Models</span>
    </div>

    <label>Upload Picture</label>

    <div class="drop-zone" id="dropZone">
        📁 Click here or drag and drop an image
        <input
            type="file"
            id="imageInput"
            accept="image/png,image/jpeg,image/webp,image/gif"
            hidden
        >
    </div>

    <p class="hint">JPG, PNG, WEBP or GIF. Maximum 4 MB.</p>

    <img id="preview" alt="Image preview">

    <label for="prompt">What would you like to know?</label>

    <textarea id="prompt" rows="3">Identify this picture. Describe exactly what is shown, including the main objects, people, animals, environment, and any interesting details.</textarea>

    <div class="checkbox-row">
        <input type="checkbox" id="detailed" checked>
        <label for="detailed" style="margin:0;font-weight:normal">
            Give me a detailed analysis
        </label>
    </div>

    <button id="analyzeBtn" disabled>
        🔍 Identify Image
    </button>

    <div id="status"></div>

    <div id="result"></div>

</div>

<script>
    const imageInput = document.getElementById("imageInput");
    const dropZone = document.getElementById("dropZone");
    const preview = document.getElementById("preview");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    let selectedFile = null;

    dropZone.addEventListener("click", () => {
        imageInput.click();
    });

    imageInput.addEventListener("change", (e) => {
        if (e.target.files.length) {
            loadImage(e.target.files[0]);
        }
    });

    dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "#818cf8";
    });

    dropZone.addEventListener("dragleave", () => {
        dropZone.style.borderColor = "#586783";
    });

    dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "#586783";

        const file = e.dataTransfer.files[0];

        if (file) loadImage(file);
    });

    function loadImage(file) {
        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"
        ];

        if (!allowedTypes.includes(file.type)) {
            alert("Please upload a JPG, PNG, WEBP or GIF image.");
            return;
        }

        if (file.size > 4 * 1024 * 1024) {
            alert("Image must be smaller than 4 MB.");
            return;
        }

        selectedFile = file;

        const reader = new FileReader();

        reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = "block";
            analyzeBtn.disabled = false;
            result.style.display = "none";
            status.textContent = "";

            dropZone.innerHTML =
                "✅ " + file.name +
                '<br><small>Click to change image</small>';

            dropZone.appendChild(imageInput);
        };

        reader.readAsDataURL(file);
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(
                new Error("Could not read image.")
            );

            reader.readAsDataURL(file);
        });
    }

    async function analyzeImage() {
        if (!selectedFile) {
            alert("Please upload an image first.");
            return;
        }

        const prompt = document.getElementById("prompt").value.trim();
        const detailed = document.getElementById("detailed").checked;

        if (!prompt) {
            alert("Please enter a question or prompt.");
            return;
        }

        analyzeBtn.disabled = true;
        status.textContent = "⏳ Preparing your image...";
        result.style.display = "none";

        try {
            const base64Image = await fileToBase64(selectedFile);

            const finalPrompt = detailed
                ? prompt + "\n\nProvide a detailed, well-structured answer. Include the likely identity of the subject, visual evidence, relevant context, and any uncertainty. Do not invent details that cannot be determined from the image."
                : prompt;

            status.textContent = "🤖 AI is analyzing your image...";

            const response = await fetch(
                "/.netlify/functions/analyze",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        image: base64Image,
                        prompt: finalPrompt
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Image analysis failed."
                );
            }

            if (!data.answer) {
                throw new Error("The AI returned an empty response.");
            }

            result.textContent = data.answer;
            result.style.display = "block";

            status.textContent = "✅ Image analysis completed!";

        } catch (error) {
            status.textContent = "❌ Something went wrong.";

            result.textContent = error.message;
            result.style.display = "block";

        } finally {
            analyzeBtn.disabled = !selectedFile;
        }
    }

    analyzeBtn.addEventListener("click", analyzeImage);
</script>

</body>
</html>
