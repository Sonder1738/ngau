
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Identifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #10131c;
            color: #f1f5f9;
        }

        .container {
            max-width: 720px;
            margin: auto;
            background: #1b2030;
            padding: 28px;
            border-radius: 16px;
            border: 1px solid #30394d;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3b465c;
            background: #111827;
            color: white;
            font-size: 14px;
        }

        input[type="file"] {
            cursor: pointer;
        }

        .drop-zone {
            border: 2px dashed #586783;
            padding: 30px 15px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            color: #aab6ca;
            margin-top: 10px;
        }

        .drop-zone:hover {
            border-color: #818cf8;
            background: #242c40;
        }

        #preview {
            display: none;
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            margin-top: 20px;
            border-radius: 10px;
            background: #111827;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #4f46e5;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 10px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #status {
            text-align: center;
            color: #a5b4fc;
            margin-top: 15px;
        }

        .hint {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 6px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            color: #cbd5e1;
            font-size: 13px;
        }

        .checkbox-row input {
            width: auto;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🔍 AI Image Identifier</h1>

    <p class="subtitle">
        Upload a picture and let AI tell you what it sees.
    </p>

    <label for="apiKey">OpenRouter API Key</label>
    <input
        type="password"
        id="apiKey"
        placeholder="sk-or-v1-..."
        autocomplete="off"
    >

    <div class="hint">
        Your key is used only for API requests from this browser.
    </div>

    <label for="model">AI Model</label>
    <select id="model">
        <option value="google/gemini-2.5-flash">
            Google Gemini 2.5 Flash
        </option>
        <option value="openai/gpt-4o-mini">
            OpenAI GPT-4o Mini
        </option>
        <option value="anthropic/claude-sonnet-4">
            Claude Sonnet 4
        </option>
        <option value="google/gemini-2.5-pro">
            Google Gemini 2.5 Pro
        </option>
    </select>

    <label>Upload Picture</label>

    <div class="drop-zone" id="dropZone">
        📁 Click here or drag and drop an image
        <input
            type="file"
            id="imageInput"
            accept="image/png,image/jpeg,image/webp,image/gif"
            hidden
        >
    </div>

    <img id="preview" alt="Image preview">

    <label for="prompt">What would you like to know?</label>
    <textarea id="prompt" rows="3">Identify this picture. Describe exactly what is shown, including the main objects, people, animals, environment, and any interesting details.</textarea>

    <div class="checkbox-row">
        <input type="checkbox" id="detailed" checked>
        <label for="detailed" style="margin:0;font-weight:normal">
            Give me a detailed analysis
        </label>
    </div>

    <button id="analyzeBtn" disabled onclick="analyzeImage()">
        🔍 Identify Image
    </button>

    <div id="status"></div>

    <div id="result"></div>

</div>

<script>
    const imageInput = document.getElementById("imageInput");
    const dropZone = document.getElementById("dropZone");
    const preview = document.getElementById("preview");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    let selectedFile = null;

    // Image selection
    dropZone.addEventListener("click", () => {
        imageInput.click();
    });

    imageInput.addEventListener("change", (e) => {
        if (e.target.files.length) {
            loadImage(e.target.files[0]);
        }
    });

    // Drag and drop
    dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "#818cf8";
    });

    dropZone.addEventListener("dragleave", () => {
        dropZone.style.borderColor = "#586783";
    });

    dropZone.addEventListener("drop", (e) => {
        e.preventDefault();

        const file = e.dataTransfer.files[0];

        if (file) {
            loadImage(file);
        }
    });

    function loadImage(file) {
        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"
        ];

        if (!allowedTypes.includes(file.type)) {
            alert("Please upload a JPG, PNG, WEBP or GIF image.");
            return;
        }

        if (file.size > 15 * 1024 * 1024) {
            alert("Image must be smaller than 15 MB.");
            return;
        }

        selectedFile = file;

        const reader = new FileReader();

        reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = "block";
            analyzeBtn.disabled = false;
            result.style.display = "none";
            status.textContent = "";

            dropZone.innerHTML =
                "✅ " + file.name +
                '<br><small>Click to change image</small>';

            dropZone.appendChild(imageInput);
        };

        reader.readAsDataURL(file);
    }

    // Convert image to a data URL
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;

            reader.readAsDataURL(file);
        });
    }

    // Analyze image with OpenRouter
    async function analyzeImage() {

        const apiKey = document.getElementById("apiKey").value.trim();
        const model = document.getElementById("model").value;
        const prompt = document.getElementById("prompt").value.trim();
        const detailed = document.getElementById("detailed").checked;

        if (!apiKey) {
            alert("Please enter your OpenRouter API key.");
            return;
        }

        if (!selectedFile) {
            alert("Please upload an image first.");
            return;
        }

        if (!prompt) {
            alert("Please enter a question or prompt.");
            return;
        }

        analyzeBtn.disabled = true;
        status.textContent = "⏳ AI is examining your picture...";
        result.style.display = "none";

        try {

            const base64Image = await fileToBase64(selectedFile);

            const finalPrompt = detailed
                ? prompt + "\n\nProvide a detailed, well-structured answer. Include the likely identity of the subject, visual evidence, relevant context, and any uncertainty. Do not invent details that cannot be determined from the image."
                : prompt;

            const response = await fetch(
                "https://openrouter.ai/api/v1/chat/completions",
                {
                    method: "POST",

                    headers: {
                        "Authorization": "Bearer " + apiKey,
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        model: model,

                        messages: [
                            {
                                role: "user",

                                content: [
                                    {
                                        type: "text",
                                        text: finalPrompt
                                    },
                                    {
                                        type: "image_url",
                                        image_url: {
                                            url: base64Image
                                        }
                                    }
                                ]
                            }
                        ],

                        max_tokens: 1500
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error?.message ||
                    "OpenRouter API request failed: " + response.status
                );
            }

            const answer =
                data.choices?.[0]?.message?.content;

            if (!answer) {
                throw new Error("The AI returned an empty response.");
            }

            result.textContent = answer;
            result.style.display = "block";

            status.textContent = "✅ Image analysis completed!";

        } catch (error) {

            status.textContent = "❌ Something went wrong.";

            result.textContent = error.message;
            result.style.display = "block";

        } finally {

            analyzeBtn.disabled = false;

        }
    }

</script>

</body>
</html>
